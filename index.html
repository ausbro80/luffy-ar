<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🏴‍☠️ 루피 고무고무 피스톨 AR 🥊</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --luffy-red: #E63946; --luffy-yellow: #FFD60A; --pirate: #1D3557; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Trebuchet MS', sans-serif; color: #fff; }

  #start-screen {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at center, rgba(230,57,70,0.3), #0a0a18 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    transition: opacity 0.6s ease;
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; }

  .straw-hat-emoji { font-size: 80px; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  h1 {
    font-size: clamp(28px, 7vw, 48px); font-weight: 900; letter-spacing: 2px;
    color: var(--luffy-yellow);
    text-shadow: 0 4px 20px rgba(255,214,10,0.5);
    margin-bottom: 8px;
  }
  .subtitle { font-size: 12px; letter-spacing: 4px; color: rgba(255,214,10,0.8); margin-bottom: 16px; }
  .birthday {
    background: linear-gradient(135deg, #FFD60A, #E63946);
    color: #1D3557; padding: 8px 20px; border-radius: 999px;
    font-weight: 900; font-size: 13px; letter-spacing: 2px;
    margin-bottom: 28px; animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  .start-btn {
    background: linear-gradient(180deg, var(--luffy-red), #B22222);
    color: #fff; border: 4px solid #1D3557;
    padding: 18px 48px; font-size: 18px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(230,57,70,0.5);
  }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .instructions {
    margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.85);
    line-height: 1.7; max-width: 320px;
  }
  .instructions b { color: var(--luffy-yellow); }

  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  #video.mirror { transform: scaleX(-1); }
  #three-canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  #ar-ui {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 16px; display: none; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  #ar-ui.active { display: flex; }
  .badge {
    background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
    border: 2px solid var(--luffy-yellow);
    padding: 8px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    color: var(--luffy-yellow); pointer-events: auto;
  }
  .badge::before { content: '🏴‍☠️'; margin-right: 6px; }

  .stop-btn {
    background: var(--luffy-red); color: #fff; border: 2px solid #fff;
    padding: 8px 16px; border-radius: 999px;
    font-size: 11px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer; pointer-events: auto;
  }
  .cam-switch-btn {
    background: rgba(0,0,0,0.7); color: #fff; border: 2px solid var(--luffy-yellow);
    padding: 8px 12px; border-radius: 999px;
    font-size: 14px; cursor: pointer; pointer-events: auto;
  }

  #hint {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    z-index: 50; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    padding: 14px 24px; border: 3px solid var(--luffy-yellow);
    border-radius: 999px; font-size: 14px; font-weight: 700;
    color: var(--luffy-yellow); display: none; white-space: nowrap; text-align: center;
  }
  #hint.active { display: block; }
  #hint.attack { border-color: var(--luffy-red); color: var(--luffy-red); animation: pulse 0.6s infinite; }

  #punch-text {
    position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
    z-index: 80;
    font-size: clamp(40px, 12vw, 100px);
    font-weight: 900; color: var(--luffy-red);
    text-shadow: 0 0 30px rgba(230,57,70,0.8), 6px 6px 0 #1D3557;
    -webkit-text-stroke: 4px #FFD60A;
    letter-spacing: 4px; line-height: 1.0;
    display: none; pointer-events: none; text-align: center;
  }
  #punch-text.active { display: block; animation: punch-shake 0.8s ease-out; }
  @keyframes punch-shake {
    0% { transform: translate(-50%, -50%) scale(0.3) rotate(-30deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.4) rotate(8deg); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.1) rotate(-4deg); }
    70% { transform: translate(-50%, -50%) scale(1.0) rotate(2deg); }
    100% { transform: translate(-50%, -50%) scale(1.0) rotate(0deg); opacity: 0; }
  }

  #punch-counter {
    position: fixed; top: 70px; right: 12px; z-index: 50;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    border: 2px solid var(--luffy-yellow);
    padding: 8px 14px; border-radius: 12px;
    color: var(--luffy-yellow); font-weight: 900; font-size: 14px;
    display: none;
  }
  #punch-counter.active { display: block; }

  #hand-indicator {
    position: fixed; top: 70px; left: 12px; z-index: 50;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    padding: 8px 14px; border-radius: 12px;
    font-size: 14px; font-weight: 900;
    display: none; transition: border-color 0.2s;
    border: 2px solid #666; color: #aaa;
  }
  #hand-indicator.active { display: block; }
  #hand-indicator.fist { border-color: var(--luffy-red); color: var(--luffy-red); animation: pulse 0.4s infinite; }
  #hand-indicator.open { border-color: #4caf50; color: #4caf50; }
  #hand-indicator.double {
    border-color: var(--luffy-yellow);
    color: var(--luffy-yellow);
    background: rgba(230,57,70,0.3);
    animation: pulse 0.3s infinite;
    font-size: 16px;
    text-shadow: 0 0 10px rgba(255,214,10,0.8);
  }

  #status-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  #status-overlay.active { display: flex; }
  .status-card {
    background: rgba(255,255,255,0.05); border: 3px solid var(--luffy-red);
    border-radius: 16px; padding: 32px; max-width: 360px;
  }
  .status-card h3 { color: var(--luffy-yellow); margin-bottom: 12px; font-size: 20px; }
  .status-card p { font-size: 13px; line-height: 1.5; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(230,57,70,0.2);
    border-top-color: var(--luffy-red);
    border-radius: 50%; margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="start-screen">
  <div class="straw-hat-emoji">🏴‍☠️</div>
  <h1>고무고무 AR</h1>
  <div class="subtitle">MUGIWARA NO LUFFY</div>
  <div class="birthday">🎂 5월 5일 LUFFY 생일 🎂</div>
  <button class="start-btn" id="start-btn" disabled>LOADING...</button>
  <div class="instructions">
    👆 화면을 탭해서 <b>바닥</b>에 루피 소환!<br>
    ✊ 주먹 1개 → <b>일반 펀치</b><br>
    ✊✊ 주먹 2개 → <b>고무고무 피스톨!!</b> 🥊
  </div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>

<div id="ar-ui">
  <div class="badge">LUFFY LIVE</div>
  <div style="display: flex; gap: 8px; pointer-events: auto;">
    <button class="cam-switch-btn" id="cam-switch-btn" title="카메라 전환">🔄</button>
    <button class="stop-btn" id="stop-btn">EXIT</button>
  </div>
</div>

<div id="hand-indicator">✋ HAND</div>
<div id="punch-counter">🥊 <span id="punch-count">0</span></div>

<div id="hint" class="active">📷 카메라 준비 중...</div>

<div id="punch-text">고무고무<br>피스톨!!</div>

<div id="status-overlay" class="active">
  <div class="status-card" id="status-content">
    <div class="spinner"></div>
    <h3>LOADING</h3>
    <p>잠시만요...</p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const startScreen = document.getElementById('start-screen');
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const arUI = document.getElementById('ar-ui');
const hintEl = document.getElementById('hint');
const punchTextEl = document.getElementById('punch-text');
const punchCounterEl = document.getElementById('punch-counter');
const punchCountSpan = document.getElementById('punch-count');
const handIndicator = document.getElementById('hand-indicator');
const statusOv = document.getElementById('status-overlay');
const statusContent = document.getElementById('status-content');
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('three-canvas');

let punchCount = 0;
let lastPunchTime = 0;
let currentFacing = 'environment';

function showStatus(html) { statusContent.innerHTML = html; statusOv.classList.add('active'); }
function hideStatus() { statusOv.classList.remove('active'); }
function showError(t, m) {
  statusContent.innerHTML = `<h3 style="color:#ff6677">⚠ ${t}</h3><p>${m}</p><button onclick="location.reload()" style="margin-top:16px;background:#FFD60A;color:#1D3557;border:none;padding:8px 24px;border-radius:999px;font-weight:900;cursor:pointer">RETRY</button>`;
  statusOv.classList.add('active');
}

let scene, camera, renderer;
let luffyModel = null;
let luffyMixer = null;
let idleAction = null;
let punchAction = null;
let armBones = { L: [], R: [] };
let isPunching = false;
let confettiParticles = [];

// 고무고무 늘리기 (매 프레임 강제 적용용)
let stretchAmount = 1.0;

function initThree() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 0);
  camera.lookAt(0, 0, -2);

  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const dir1 = new THREE.DirectionalLight(0xffffff, 1.5);
  dir1.position.set(2, 4, 3);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffeeaa, 0.6);
  dir2.position.set(-2, 2, 2);
  scene.add(dir2);
}

async function loadLuffy() {
  const loader = new GLTFLoader();
  const gltf = await new Promise((resolve, reject) => {
    loader.load('./assets/luffy_animated.glb?v=' + Date.now(), resolve, undefined, reject);
  });

  luffyModel = gltf.scene;

  luffyModel.traverse((child) => {
    if (child.isMesh && child.material) {
      child.material.side = THREE.DoubleSide;
      if (child.material.metalness !== undefined) {
        child.material.metalness = 0.05;
      }
    }
  });

  luffyModel.scale.setScalar(0.5);
  luffyModel.position.set(0, -10, 0);
  luffyModel.visible = false;
  scene.add(luffyModel);

  const shadowMesh = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
  );
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = 0.01;
  shadowMesh.visible = false;
  luffyModel.userData.shadow = shadowMesh;
  scene.add(shadowMesh);

  if (gltf.animations && gltf.animations.length > 0) {
    luffyMixer = new THREE.AnimationMixer(luffyModel);

    console.log('Animations:');
    gltf.animations.forEach((clip, i) => {
      console.log(`  [${i}] ${clip.name} (${clip.duration.toFixed(2)}s)`);
    });

    let idleClip, punchClip;
    if (gltf.animations.length >= 2) {
      const sorted = [...gltf.animations].sort((a, b) => b.duration - a.duration);
      idleClip = sorted[0];
      punchClip = sorted[1];
    } else {
      idleClip = punchClip = gltf.animations[0];
    }
    console.log('Idle:', idleClip.name, idleClip.duration);
    console.log('Punch:', punchClip.name, punchClip.duration);

    // 🦾 punch 애니메이션의 RightArm/RightForeArm scale 트랙 제거
    // 이걸 안 빼면 우리가 늘려도 mixer가 매 프레임 1.0으로 덮어씀
    const tracksRemoved = [];
    punchClip.tracks = punchClip.tracks.filter(track => {
      const isScaleTrack = track.name.includes('.scale');
      const isRightArm = track.name.includes('RightArm') || track.name.includes('RightForeArm');
      if (isScaleTrack && isRightArm) {
        tracksRemoved.push(track.name);
        return false; // 제거
      }
      return true;
    });
    console.log('Removed scale tracks:', tracksRemoved);

    // idle도 마찬가지로
    idleClip.tracks = idleClip.tracks.filter(track => {
      const isScaleTrack = track.name.includes('.scale');
      const isRightArm = track.name.includes('RightArm') || track.name.includes('RightForeArm');
      if (isScaleTrack && isRightArm) return false;
      return true;
    });

    idleAction = luffyMixer.clipAction(idleClip);
    idleAction.setLoop(THREE.LoopRepeat);
    idleAction.play();

    punchAction = luffyMixer.clipAction(punchClip);
    punchAction.setLoop(THREE.LoopOnce);
    punchAction.clampWhenFinished = false;

    luffyMixer.addEventListener('finished', (e) => {
      if (e.action === punchAction) {
        punchAction.stop();
        idleAction.reset();
        idleAction.play();
      }
    });
  }

  // 🦾 팔 본 찾기 (고무고무 늘리기용)
  // mixamo 본 이름: mixamorig:RightArm, mixamorig:RightForeArm
  // Bone 타입 체크 빼고 이름으로만 찾기 (더 안정적)
  luffyModel.traverse((child) => {
    const n = child.name;
    if (n === 'mixamorig:RightArm' || n === 'mixamorig:RightForeArm') {
      armBones.R.push(child);
    }
    if (n === 'mixamorig:LeftArm' || n === 'mixamorig:LeftForeArm') {
      armBones.L.push(child);
    }
  });
  console.log('Arm bones found - L:', armBones.L.length, 'R:', armBones.R.length);
  armBones.R.forEach(b => console.log('  R:', b.name, 'type:', b.type));
  armBones.L.forEach(b => console.log('  L:', b.name, 'type:', b.type));

  // 못 찾았으면 모든 노드 이름 출력 (디버깅용)
  if (armBones.R.length === 0) {
    console.warn('❌ No arm bones found! Listing all named nodes:');
    luffyModel.traverse((child) => {
      if (child.name && child.name.includes('mixamorig')) {
        console.log('  -', child.name, '(' + child.type + ')');
      }
    });
  }
}

const raycaster = new THREE.Raycaster();
const tapVec = new THREE.Vector2();
let luffyPlaced = false;

function handleTap(event) {
  if (!luffyModel) return;
  if (event.target && event.target.closest('button')) return;
  if (event.target && event.target.closest('#ar-ui')) return;

  let clientX, clientY;
  if (event.touches && event.touches.length > 0) {
    clientX = event.touches[0].clientX;
    clientY = event.touches[0].clientY;
  } else if (event.changedTouches && event.changedTouches.length > 0) {
    clientX = event.changedTouches[0].clientX;
    clientY = event.changedTouches[0].clientY;
  } else {
    clientX = event.clientX;
    clientY = event.clientY;
  }

  tapVec.x = (clientX / window.innerWidth) * 2 - 1;
  tapVec.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(tapVec, camera);
  const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const point = new THREE.Vector3();

  if (raycaster.ray.intersectPlane(floorPlane, point)) {
    if (point.z > 0 || point.z < -8) return;
    placeLuffyAt(point);
  }
}

function placeLuffyAt(position) {
  if (!luffyModel) return;

  luffyModel.visible = true;
  luffyModel.position.copy(position);
  const angle = Math.atan2(camera.position.x - position.x, camera.position.z - position.z);
  luffyModel.rotation.y = angle;

  if (luffyModel.userData.shadow) {
    luffyModel.userData.shadow.position.set(position.x, 0.01, position.z);
    luffyModel.userData.shadow.visible = true;
  }

  if (!luffyPlaced) {
    luffyPlaced = true;
    luffyModel.scale.setScalar(0.01);
    const startTime = performance.now();
    function growStep() {
      const elapsed = performance.now() - startTime;
      const t = Math.min(1, elapsed / 600);
      const eased = 1 - Math.pow(1 - t, 3);
      const scale = 0.01 + (0.5 - 0.01) * eased;
      luffyModel.scale.setScalar(scale);
      if (t < 1) requestAnimationFrame(growStep);
    }
    requestAnimationFrame(growStep);

    hintEl.textContent = '✊ 주먹을 쥐어보세요!';
    spawnConfetti();
    if (navigator.vibrate) navigator.vibrate([50, 30, 100]);
  } else {
    spawnSmallPoof(position);
  }
}

function spawnSmallPoof(position) {
  for (let i = 0; i < 12; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.8 })
    );
    p.position.copy(position);
    p.position.y += 0.1;
    p.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 1.5,
      Math.random() * 1.0 + 0.3,
      (Math.random() - 0.5) * 1.5
    );
    p.userData.life = 1.0;
    p.userData.maxLife = 0.6;
    scene.add(p);
    confettiParticles.push(p);
  }
}

function triggerPunch(mode = 'normal') {
  if (!luffyPlaced) return;
  if (!punchAction) return;
  const now = performance.now();
  if (now - lastPunchTime < 1500) return;
  lastPunchTime = now;
  isPunching = true;

  punchCount++;
  punchCountSpan.textContent = punchCount;
  punchCounterEl.classList.add('active');

  // 텍스트: 모드별 다른 표시
  if (mode === 'gomu') {
    punchTextEl.innerHTML = '고무고무<br>피스톨!!';
  } else {
    punchTextEl.innerHTML = 'PUNCH!!';
  }
  punchTextEl.classList.remove('active');
  void punchTextEl.offsetWidth;
  punchTextEl.classList.add('active');
  setTimeout(() => punchTextEl.classList.remove('active'), 800);

  if (navigator.vibrate) {
    if (mode === 'gomu') {
      navigator.vibrate([100, 50, 200, 50, 200]); // 더 강한 진동
    } else {
      navigator.vibrate([80, 30, 100]);
    }
  }

  // 🥊 punch 애니메이션 재생 (둘 다 같은 애니메이션 사용)
  idleAction.stop();
  punchAction.reset();
  punchAction.play();

  // 🦾 고무고무 모드일 때만 팔 늘리기 (stretchAmount만 업데이트, 적용은 render loop에서)
  if (mode === 'gomu') {
    const stretchStart = performance.now();
    const stretchDuration = 1500;
    const maxStretch = 4.0;

    function stretchStep() {
      const elapsed = performance.now() - stretchStart;
      const t = elapsed / stretchDuration;
      if (t >= 1) {
        stretchAmount = 1.0; // 원위치
        isPunching = false;
        return;
      }

      let progress;
      if (t < 0.35) {
        progress = t / 0.35;
        progress = 1 - Math.pow(1 - progress, 3);
      } else {
        progress = 1 - ((t - 0.35) / 0.65);
        progress = Math.max(0, progress);
      }

      stretchAmount = 1 + (maxStretch - 1) * progress;
      requestAnimationFrame(stretchStep);
    }
    requestAnimationFrame(stretchStep);
  } else {
    setTimeout(() => { isPunching = false; }, 1500);
  }

  spawnConfetti(mode);
}

function spawnConfetti(mode = 'normal') {
  const count = mode === 'gomu' ? 50 : 20; // 고무고무 더 많이
  for (let i = 0; i < count; i++) {
    const colors = mode === 'gomu'
      ? [0xFFD60A, 0xE63946, 0x06D6A0, 0x118AB2, 0xFFFFFF, 0xFF6B35] // 고무고무 6색
      : [0xFFFFFF, 0xFFD60A]; // 일반은 단순
    const color = colors[Math.floor(Math.random() * colors.length)];
    const p = new THREE.Mesh(
      new THREE.PlaneGeometry(0.05, 0.05),
      new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, depthWrite: false })
    );
    const basePos = luffyModel ? luffyModel.position : new THREE.Vector3(0, 0, -2);
    p.position.set(
      basePos.x + (Math.random() - 0.5) * 0.5,
      basePos.y + 1.5 + Math.random() * 0.5,
      basePos.z + 0.3
    );
    p.userData.velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 2.5,
      Math.random() * 2.5 + 1.0,
      (Math.random() - 0.5) * 1.5
    );
    p.userData.rotSpeed = (Math.random() - 0.5) * 8;
    p.userData.life = 1.0;
    p.userData.maxLife = 1.5 + Math.random() * 1.0;
    scene.add(p);
    confettiParticles.push(p);
  }
}

let hands = null;
let camera_utils = null;

async function initMediaPipe() {
  hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });
  hands.onResults(onHandsResults);

  camera_utils = new Camera(videoEl, {
    onFrame: async () => { await hands.send({ image: videoEl }); },
    width: 640, height: 480
  });
  camera_utils.start();
}

function onHandsResults(results) {
  if (!luffyPlaced) return;

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    handIndicator.classList.remove('active', 'fist', 'open', 'double');
    hintEl.classList.remove('attack');
    if (hintEl.classList.contains('active')) {
      hintEl.textContent = '✋ 손을 카메라 앞에 보여주세요';
    }
    return;
  }

  // 모든 손 분석 (최대 2개)
  const hands = results.multiHandLandmarks;
  const fists = hands.filter(landmarks => detectFist(landmarks));
  const fistCount = fists.length;
  const handCount = hands.length;

  handIndicator.classList.add('active');
  hintEl.classList.add('active');

  if (fistCount >= 2) {
    // 🔥 두 주먹 = 고무고무 피스톨!
    handIndicator.classList.remove('fist', 'open');
    handIndicator.classList.add('double');
    handIndicator.textContent = '✊✊ GOMU GOMU!';
    hintEl.classList.add('attack');
    hintEl.textContent = '🥊 고무고무 피스톨!!';
    triggerPunch('gomu'); // 고무고무
  } else if (fistCount === 1) {
    // 일반 펀치
    handIndicator.classList.remove('open', 'double');
    handIndicator.classList.add('fist');
    handIndicator.textContent = '✊ PUNCH!';
    hintEl.classList.add('attack');
    hintEl.textContent = '🥊 펀치!';
    triggerPunch('normal');
  } else {
    // 손은 보이지만 주먹 X
    handIndicator.classList.remove('fist', 'double');
    handIndicator.classList.add('open');
    handIndicator.textContent = handCount >= 2 ? '✋✋ OPEN' : '✋ OPEN';
    hintEl.classList.remove('attack');
    if (handCount >= 2) {
      hintEl.textContent = '✊✊ 두 주먹 = 고무고무!';
    } else {
      hintEl.textContent = '✊ 주먹 1개 = 펀치 / ✊✊ 2개 = 고무고무!';
    }
  }
}

function detectFist(landmarks) {
  if (!landmarks || landmarks.length < 21) return false;
  const wrist = landmarks[0];
  const tips = [8, 12, 16, 20];
  const bases = [5, 9, 13, 17];
  let foldedCount = 0;
  for (let i = 0; i < tips.length; i++) {
    const tip = landmarks[tips[i]];
    const base = landmarks[bases[i]];
    const distTipToWrist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
    const distBaseToWrist = Math.hypot(base.x - wrist.x, base.y - wrist.y);
    if (distTipToWrist < distBaseToWrist * 1.05) foldedCount++;
  }
  return foldedCount >= 3;
}

async function switchCamera() {
  if (!videoEl.srcObject) return;

  // 기존 스트림 + MediaPipe 완전 정리
  videoEl.srcObject.getTracks().forEach(t => t.stop());
  videoEl.srcObject = null;

  if (camera_utils) {
    try { camera_utils.stop(); } catch(e) {}
    camera_utils = null;
  }

  // 잠깐 대기 (스트림 완전 종료)
  await new Promise(r => setTimeout(r, 200));

  currentFacing = currentFacing === 'user' ? 'environment' : 'user';
  console.log('Switching to:', currentFacing);

  try {
    await startCameraStream();
    // MediaPipe도 새 비디오 스트림으로 재초기화
    await new Promise(r => setTimeout(r, 100));
    await initMediaPipe();
    console.log('Camera switched to:', currentFacing);
  } catch (e) {
    console.error('Camera switch failed:', e);
  }
}

async function startCameraStream() {
  // 후면 카메라 강제 (iOS도 작동하도록 exact 사용)
  const constraints = {
    video: {
      facingMode: currentFacing === 'environment' ? { exact: 'environment' } : 'user',
      width: { ideal: 1280 },
      height: { ideal: 720 }
    }
  };

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    console.warn('Exact facingMode failed, fallback:', e);
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: currentFacing }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  }

  videoEl.srcObject = stream;
  await new Promise(resolve => videoEl.onloadedmetadata = resolve);
  await videoEl.play();

  if (currentFacing === 'user') {
    videoEl.classList.add('mirror');
  } else {
    videoEl.classList.remove('mirror');
  }
}

async function startAR() {
  try {
    showStatus(`<div class="spinner"></div><h3>CAMERA INIT</h3>`);
    initThree();

    showStatus(`<div class="spinner"></div><h3>CAMERA ACCESS</h3>`);
    currentFacing = 'environment'; // 무조건 후면 시작
    await startCameraStream();

    showStatus(`<div class="spinner"></div><h3>LOADING LUFFY</h3>`);
    await loadLuffy();

    showStatus(`<div class="spinner"></div><h3>HAND TRACKING INIT</h3>`);
    await initMediaPipe();

    hideStatus();
    arUI.classList.add('active');
    hintEl.classList.add('active');
    hintEl.textContent = '👆 바닥/책상을 탭하세요!';

    document.addEventListener('click', handleTap);
    document.addEventListener('touchend', (e) => { handleTap(e); }, { passive: true });

    const clock = new THREE.Clock();
    function render() {
      const dt = clock.getDelta();
      if (luffyMixer) luffyMixer.update(dt);

      // 🦾 고무고무 강제 적용 (mixer가 덮어씌운 scale을 다시 설정)
      // mixer.update() 직후에 적용해야 mixer가 다시 덮어쓰지 못함
      if (armBones.R.length > 0) {
        armBones.R.forEach(b => {
          b.scale.y = stretchAmount;
        });
      }

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.userData.life -= dt / p.userData.maxLife;
        p.position.x += p.userData.velocity.x * dt;
        p.position.y += p.userData.velocity.y * dt;
        p.position.z += p.userData.velocity.z * dt;
        p.userData.velocity.y -= 4 * dt;
        p.rotation.z += p.userData.rotSpeed * dt;
        p.material.opacity = Math.max(0, p.userData.life);
        if (p.userData.life <= 0) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          confettiParticles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }
    render();

  } catch (err) {
    console.error(err);
    let msg = err.message || String(err);
    if (msg.includes('Permission') || msg.includes('denied')) msg = '카메라 권한이 필요합니다';
    if (location.protocol === 'file:') msg = 'https/localhost로 띄워주세요';
    showError('AR INIT FAILED', msg);
  }
}

function stopAR() {
  if (videoEl.srcObject) {
    videoEl.srcObject.getTracks().forEach(t => t.stop());
    videoEl.srcObject = null;
  }
  if (camera_utils) camera_utils.stop();
  document.removeEventListener('click', handleTap);
  arUI.classList.remove('active');
  hintEl.classList.remove('active');
  punchCounterEl.classList.remove('active');
  handIndicator.classList.remove('active');
  luffyPlaced = false;
  if (luffyModel) {
    luffyModel.visible = false;
    if (luffyModel.userData.shadow) luffyModel.userData.shadow.visible = false;
  }
  startScreen.classList.remove('hidden');
}

function waitForMediaPipe() {
  return new Promise((resolve) => {
    const check = () => {
      if (typeof Hands !== 'undefined' && typeof Camera !== 'undefined') resolve();
      else setTimeout(check, 100);
    };
    check();
  });
}

waitForMediaPipe().then(() => {
  hideStatus();
  startBtn.disabled = false;
  startBtn.textContent = '⚡ START ⚡';
});

startBtn.addEventListener('click', () => {
  if (startBtn.disabled) return;
  startScreen.classList.add('hidden');
  setTimeout(startAR, 500);
});
stopBtn.addEventListener('click', stopAR);
document.getElementById('cam-switch-btn').addEventListener('click', switchCamera);

window.addEventListener('resize', () => {
  if (camera && renderer) {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
});
</script>
